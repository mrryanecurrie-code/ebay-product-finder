<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>eBay Product Finder</title><style>body{font-family:system-ui;max-width:1100px;margin:40px auto;padding:0 20px;background:#f6f7f9;color:#161616}h1{font-size:32px}form{display:flex;gap:10px}input{flex:1;padding:14px;border:1px solid #bbb;border-radius:8px;font-size:16px}button{padding:14px 24px;border:0;border-radius:8px;background:#111;color:#fff;font-weight:700}.card{background:white;margin-top:16px;padding:20px;border-radius:12px;box-shadow:0 1px 4px #0002}.buy{font-weight:800}.muted{color:#666}</style></head><body><h1>eBay Product Finder</h1><p>Amazon/Keepa demand radar → eBay opportunity → buy candidates.</p><form id="f"><input id="q" placeholder="Product or market, e.g. ANUA cleansing oil"><button>FIND PRODUCTS</button></form><div id="status"></div><div id="results"></div><script>f.onsubmit=async(e)=>{e.preventDefault();results.innerHTML='';status.textContent='Researching Amazon/Keepa and eBay…';try{const r=await fetch('/api/discover?q='+encodeURIComponent(q.value));const j=await r.json();status.textContent=`${j.candidates?.length||0} candidates worth investigating`;for(const x of j.candidates||[]){const d=document.createElement('div');d.className='card';d.innerHTML=`<div class="buy">${x.title}</div><div>Amazon monthly sold signal: ${x.amazon.monthlySold??'unknown'} · eBay active sellers: ${x.ebay.activeSellers} · eBay median delivered: ${x.ebay.medianDeliveredPrice}</div><div class="muted">${x.reasons.join(' · ')}</div>`;results.appendChild(d)}}catch(err){status.textContent='Research failed: '+err.message}};</script></body></html>
