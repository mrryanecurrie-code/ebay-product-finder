<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Product Finder Settings</title><style>body{font-family:system-ui;max-width:760px;margin:40px auto;padding:0 20px;background:#f6f7f9;color:#171717}.box{background:#fff;padding:24px;border-radius:14px;box-shadow:0 1px 5px #0002}label{display:block;font-weight:700;margin-top:18px}input{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #bbb;border-radius:8px}button{margin-top:24px;padding:13px 22px;border:0;border-radius:8px;background:#111;color:#fff;font-weight:700}.note{color:#666;font-size:14px}.status{margin-top:18px}</style></head><body><h1>Connections</h1><p>Enter API credentials once. The application stores secrets encrypted and never displays the full secret again.</p><div class="box"><form id="settings"><label>eBay Production Client ID<input name="EBAY_CLIENT_ID" autocomplete="off"></label><label>eBay Production Client Secret<input name="EBAY_CLIENT_SECRET" type="password" autocomplete="new-password"></label><label>Keepa API Key<input name="KEEPA_API_KEY" type="password" autocomplete="new-password"></label><label>Historical eBay Data API Key <span class="note">(only if/when a supported provider is connected)</span><input name="HISTORICAL_EBAY_API_KEY" type="password" autocomplete="new-password"></label><button>Save Connections</button></form><div id="status" class="status"></div></div><script>settings.onsubmit=async(e)=>{e.preventDefault();status.textContent='Saving securely…';const data=Object.fromEntries(new FormData(settings).entries());for(const k of Object.keys(data))if(!data[k])delete data[k];const r=await fetch('/api/settings/credentials',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});const j=await r.json();status.textContent=r.ok?'Saved. '+(j.saved||[]).join(', '):'Error: '+(j.error||r.statusText);if(r.ok)settings.reset();};</script></body></html>
