<!doctype html><html><head><meta charset="utf-8"><style>body{font:14px system-ui;width:380px;padding:16px}h2,h3{margin:0 0 8px}h3{font-size:14px;margin-top:14px}button,input,textarea,select{box-sizing:border-box;width:100%;padding:10px;margin:4px 0;border-radius:8px;border:1px solid #bbb}button{border:0;font-weight:700;cursor:pointer}.primary{background:#111;color:#fff}.secondary{background:#eee}.ebay{background:#3665f3;color:white}.panel{border-top:1px solid #ddd;margin-top:12px;padding-top:8px}.hidden{display:none}#result{white-space:pre-wrap;font-size:12px;margin-top:10px;max-height:220px;overflow:auto}.muted{color:#666;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.good{font-weight:800}textarea{height:72px}</style></head><body><h2>Product Finder</h2><div class="muted">Find out if a product sells — and whether the numbers work.</div><div id="generic"><button id="investigate" class="primary">INVESTIGATE THIS PRODUCT</button><button id="scan" class="secondary">SCAN THIS PAGE</button></div><div id="ebayPanel" class="panel hidden"><h3>eBay Product Research</h3><div class="muted">20 sold listings are used as the demand sample.</div><input id="ebayQuery" placeholder="Product, UPC, SKU or search term"><button id="ebayOne" class="ebay">RESEARCH ONE PRODUCT</button><button id="ebayCurrent" class="secondary">CAPTURE CURRENT RESULTS</button><textarea id="ebayBatch" placeholder="Batch: one product / UPC / SKU per line"></textarea><button id="ebayRunBatch" class="secondary">RUN PRODUCT BATCH</button><div class="panel"><h3>Profit Check</h3><div class="grid"><input id="sourceCost" type="number" step="0.01" placeholder="Your cost"><input id="shipCost" type="number" step="0.01" placeholder="Your shipping"><input id="feeRate" type="number" step="0.01" value="13.25" placeholder="eBay fee %"><input id="adRate" type="number" step="0.01" value="0" placeholder="Promoted %"></div><div class="muted">Uses captured average sold price. Fee rate is editable because eBay fees vary by category/account.</div><button id="profitCheck" class="primary">CALCULATE BUY / PASS</button></div></div><button id="settings" class="secondary">CONNECTION SETTINGS</button><div id="result"></div><script src="popup.js"></script></body></html>
