<!doctype html><html><head><meta charset="utf-8"><style>body{font:14px system-ui;width:360px;padding:16px}h2,h3{margin:0 0 8px}h3{font-size:14px;margin-top:14px}button,input,textarea{box-sizing:border-box;width:100%;padding:11px;margin:5px 0;border-radius:8px}button{border:0;font-weight:700;cursor:pointer}.primary{background:#111;color:#fff}.secondary{background:#eee}.ebay{background:#3665f3;color:white}.panel{border-top:1px solid #ddd;margin-top:12px;padding-top:4px}.hidden{display:none}#result{white-space:pre-wrap;font-size:12px;margin-top:10px;max-height:150px;overflow:auto}.muted{color:#666;font-size:12px}textarea{height:82px;border:1px solid #bbb}input{border:1px solid #bbb}</style></head><body><h2>Product Finder</h2><div class="muted">Research what you're looking at without opening DevTools.</div><div id="generic"><button id="investigate" class="primary">INVESTIGATE THIS PRODUCT</button><button id="scan" class="secondary">SCAN THIS PAGE</button></div><div id="ebayPanel" class="panel hidden"><h3>eBay Product Research</h3><div class="muted">Uses the Product Research page you're already logged into.</div><input id="ebayQuery" placeholder="Product, UPC, SKU or search term"><button id="ebayOne" class="ebay">RESEARCH ONE PRODUCT</button><button id="ebayCurrent" class="secondary">CAPTURE CURRENT RESULTS</button><textarea id="ebayBatch" placeholder="Batch: one product / UPC / SKU per line"></textarea><button id="ebayRunBatch" class="secondary">RUN PRODUCT BATCH</button></div><button id="settings" class="secondary">CONNECTION SETTINGS</button><div id="result"></div><script src="popup.js"></script></body></html>
