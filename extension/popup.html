<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;min-height:100%;background:#fff}body{font:14px system-ui;padding:16px;box-sizing:border-box}h2,h3{margin:0 0 8px}h3{font-size:14px;margin-top:14px}button,input,textarea{box-sizing:border-box;width:100%;padding:10px;margin:4px 0;border-radius:8px;border:1px solid #bbb}button{border:0;font-weight:700;cursor:pointer}.primary{background:#111;color:#fff}.secondary{background:#eee}.ebay{background:#3665f3;color:white}.panel{border-top:1px solid #ddd;margin-top:12px;padding-top:8px}.hidden{display:none}#result{white-space:pre-wrap;font-size:12px;margin-top:10px;padding-bottom:30px}.muted{color:#666;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}textarea{height:72px}details{border-top:1px solid #ddd;margin-top:12px;padding-top:10px}summary{font-weight:700;cursor:pointer;margin-bottom:6px}</style></head><body><h2>Product Finder</h2><div class="muted">Persistent sourcing companion. Leave this panel open while you browse.</div><button id="investigate" class="primary">CAPTURE THIS SOURCE PRODUCT</button><button id="scan" class="secondary">SCAN THIS PAGE</button><div id="ebayPanel" class="panel hidden"><h3>eBay.com Demand Research</h3><div class="muted">Uses ~20 sold listings plus eBay Product Research metrics.</div><input id="ebayQuery" placeholder="Product, UPC, SKU or search term"><button id="ebayOne" class="ebay">RESEARCH ONE PRODUCT</button><button id="ebayCurrent" class="secondary">CAPTURE CURRENT RESULTS</button><details><summary>Batch / Brand Research</summary><textarea id="ebayBatch" placeholder="One product / UPC / SKU per line"></textarea><button id="ebayRunBatch" class="secondary">RUN PRODUCT BATCH</button></details></div><details open><summary>USD Profit Check</summary><div class="grid"><input id="sourceCost" type="number" step="0.01" placeholder="Source cost USD"><input id="shipCost" type="number" step="0.01" placeholder="Your shipping USD"><input id="feeRate" type="number" step="0.01" value="13.25" placeholder="eBay fee %"><input id="adRate" type="number" step="0.01" value="0" placeholder="Promoted %"></div><input id="cadUsdRate" type="number" step="0.0001" value="0.73" placeholder="CAD → USD rate"><button id="profitCheck" class="primary">CALCULATE USD BUY / PASS</button></details><details><summary>Settings</summary><button id="settings" class="secondary">CONNECTION SETTINGS</button></details><div id="result"></div><script src="popup.js"></script></body></html>
